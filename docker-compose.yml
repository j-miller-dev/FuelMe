# FUEL stack: app, queue worker, scheduler, redis, nightly backup.
# PostgreSQL is NOT in this file: use Coolify's Postgres 18 and set DB_HOST/DB_PORT/DB_DATABASE/DB_USERNAME/DB_PASSWORD.
# Local:   cp .env.example .env, point DB_* at a reachable Postgres 18, then docker compose up --build (http://localhost:8000 via docker-compose.override.yml)
# Coolify: deploy this file as a Docker Compose resource; set the env vars from .env.example in the UI.
x-app: &app
  build: .
  image: fuel-app
  restart: unless-stopped
  env_file: [.env]
  environment: &app-env
    DB_CONNECTION: pgsql
    REDIS_HOST: redis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
  volumes:
    - storage:/app/storage
  depends_on:
    redis: { condition: service_healthy }

services:
  app:
    <<: *app
    command: ["app"]
    # No published host port: Coolify/Traefik reaches the container on 80. Local dev maps 8000 via docker-compose.override.yml.
    expose: ["80"]

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      app: { condition: service_healthy }

  scheduler:
    <<: *app
    command: ["scheduler"]
    depends_on:
      app: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${FUEL_TIMEZONE:-Australia/Melbourne}
      PGHOST: ${DB_HOST:?set DB_HOST}
      PGPORT: ${DB_PORT:-5432}
      PGDATABASE: ${DB_DATABASE:?set DB_DATABASE}
      PGUSER: ${DB_USERNAME:?set DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      # rclone reads RCLONE_CONFIG_<REMOTE>_* env vars, so no config file is needed (see docs/DEPLOY.md).
    env_file: [.env]
    volumes:
      - backups:/backups

volumes:
  redisdata:
  storage:
  backups:
